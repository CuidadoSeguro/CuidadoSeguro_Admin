name: CI/CD — CuidadoSeguro Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: cuidado-seguro-backend
  SERVICE_PORT: 8080
  AWS_REGION: us-east-1

jobs:

  # ─────────────────────────────────────────────
  # 1. DOCKER BUILD & PUSH
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build y push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ─────────────────────────────────────────────
  # 2. DEPLOY A AWS ECS
  # ─────────────────────────────────────────────
  deploy-ecs:
    name: Deploy a ECS
    runs-on: ubuntu-latest

    needs: docker-build-push

    steps:

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ─────────────────────────────────────────
      # Obtener Task Definition actual
      # ─────────────────────────────────────────

      - name: Obtener Task Definition actual
        run: |
          CURRENT_TD=$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Task Definition actual:"
          echo "$CURRENT_TD"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TD" \
            --query 'taskDefinition' \
            --output json > current-task-definition.json


      # ─────────────────────────────────────────
      # Crear nueva Task Definition
      # ─────────────────────────────────────────

      - name: Actualizar imagen y variables
        id: register
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

          SERVER_PORT: ${{ env.SERVICE_PORT }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          AZURE_ISSUER_URI: ${{ secrets.AZURE_ISSUER_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}

        run: |

          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = [
                {
                  "name": "SERVER_PORT",
                  "value": env.SERVER_PORT
                },
                {
                  "name": "DB_HOST",
                  "value": env.DB_HOST
                },
                {
                  "name": "DB_PORT",
                  "value": env.DB_PORT
                },
                {
                  "name": "DB_NAME",
                  "value": env.DB_NAME
                },
                {
                  "name": "DB_USERNAME",
                  "value": env.DB_USERNAME
                },
                {
                  "name": "DB_PASSWORD",
                  "value": env.DB_PASSWORD
                },
                {
                  "name": "AZURE_ISSUER_URI",
                  "value": env.AZURE_ISSUER_URI
                },
                {
                  "name": "AZURE_CLIENT_ID",
                  "value": env.AZURE_CLIENT_ID
                },
                {
                  "name": "CORS_ALLOWED_ORIGINS",
                  "value": env.CORS_ALLOWED_ORIGINS
                }
              ]
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' current-task-definition.json > task-definition.json

          echo "Registrando nueva Task Definition..."

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Nueva Task Definition:"
          echo "$ARN"

          echo "task_definition_arn=$ARN" >> "$GITHUB_OUTPUT"


      # ─────────────────────────────────────────
      # Actualizar servicio ECS
      # ─────────────────────────────────────────

      - name: Actualizar servicio ECS
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --task-definition "${{ steps.register.outputs.task_definition_arn }}" \
            --force-new-deployment


      # ─────────────────────────────────────────
      # Esperar estabilidad
      # ─────────────────────────────────────────

      - name: Esperar a que ECS quede estable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"