# ─────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline — CuidadoSeguro_Admin (Spring Boot, Java 21)
#
# Secrets de GitHub requeridos (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME        → usuario de Docker Hub
#   DOCKERHUB_TOKEN           → access token de Docker Hub
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_SESSION_TOKEN         → solo si usas credenciales temporales (AWS Academy)
#   ECS_CLUSTER               → ej. cuidado-seguro-cluster
#   ECS_SERVICE               → ej. servicio-admin
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
#   AZURE_ISSUER_URI          → https://login.microsoftonline.com/<tenant-id>/v2.0
#   AZURE_CLIENT_ID           → Application (client) ID de Entra ID
#   CORS_ALLOWED_ORIGINS      → orígenes del front separados por coma
#
# Variables de GitHub (opcionales):
#   ENABLE_ECS_DEPLOY = true  → habilita el job de despliegue a ECS
#   AWS_REGION                → por defecto us-east-1
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD Pipeline Admin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: cuidado-seguro-admin
  SERVICE_PORT: 8080

jobs:
  # ── 1. Build y push de la imagen Docker ────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy a AWS ECS (Fargate) ──────────────────────────────────────────
  deploy-ecs:
    name: Deploy a ECS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: ${{ vars.ENABLE_ECS_DEPLOY == 'true' && github.event_name != 'pull_request' }}

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Toma la task definition que ya usa el servicio (familia, rol, red, logs)
      # y solo reemplaza la imagen y las variables de entorno.
      - name: Actualizar task definition con la nueva imagen y variables
        id: register
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          SERVER_PORT: ${{ env.SERVICE_PORT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AZURE_ISSUER_URI: ${{ secrets.AZURE_ISSUER_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          CURRENT_TD=$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)

          aws ecs describe-task-definition --task-definition "$CURRENT_TD" \
            --query 'taskDefinition' --output json > current-task-definition.json

          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = (
                env
                | to_entries
                | map(select(.key | IN(
                    "SERVER_PORT", "DB_HOST", "DB_PORT", "DB_NAME",
                    "DB_USERNAME", "DB_PASSWORD", "AZURE_ISSUER_URI",
                    "AZURE_CLIENT_ID", "CORS_ALLOWED_ORIGINS")))
                | map(select(.value != ""))
                | map({ name: .key, value: .value })
              )
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' current-task-definition.json > task-definition.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_definition_arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Actualizar servicio ECS
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --task-definition "${{ steps.register.outputs.task_definition_arn }}" \
            --force-new-deployment

      - name: Esperar a que el servicio quede estable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"
